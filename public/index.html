<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>昇腾开源社区指标</title>
<style>
/* ──────────────────────────────────────────────────────────────────────────
   视觉基调：仪表盘式的冷静配色 —— 深墨绿主色取自昇腾生态的技术感，
   暖灰中性色避免纯灰的廉价感，琥珀色专用于"人工录入/需留意"。
   不用 Google Fonts：国内访问慢且可能被阻断，改用系统字体栈。
   ────────────────────────────────────────────────────────────────────────── */
:root{
  --bg:#f6f6f3; --bg-2:#eceae5; --panel:#fff; --panel-2:#fbfbf9;
  --fg:#1a1c1b; --fg-2:#5c605d; --fg-3:#8b8f8b;
  --line:#e2e1db; --line-2:#cfcec6;
  --accent:#1f6b58; --accent-2:#2c8a71; --accent-soft:#e3efea;
  --blue:#2d6a92; --amber:#9a6f12; --amber-soft:#faf2dd;
  --red:#a8443a; --ok:#2b7a4b;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",
         "PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --num:"SF Mono","Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#141615; --bg-2:#1b1e1d; --panel:#1e2120; --panel-2:#232726;
  --fg:#e9eae7; --fg-2:#a4a9a5; --fg-3:#777c78;
  --line:#2c302e; --line-2:#3a3f3c;
  --accent:#4fa98c; --accent-2:#63c2a3; --accent-soft:#1c2e28;
  --blue:#6aa4c8; --amber:#d9a93c; --amber-soft:#2d2715;
  --red:#d9796e; --ok:#5cbd7e; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141615; --bg-2:#1b1e1d; --panel:#1e2120; --panel-2:#232726;
  --fg:#e9eae7; --fg-2:#a4a9a5; --fg-3:#777c78;
  --line:#2c302e; --line-2:#3a3f3c;
  --accent:#4fa98c; --accent-2:#63c2a3; --accent-soft:#1c2e28;
  --blue:#6aa4c8; --amber:#d9a93c; --amber-soft:#2d2715;
  --red:#d9796e; --ok:#5cbd7e; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);
     font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-block:26px 56px;
      padding-left:max(18px,env(safe-area-inset-left,0px));
      padding-right:max(18px,env(safe-area-inset-right,0px));
      display:flex;flex-direction:column;gap:22px}

/* 头部 */
.masthead{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;
          justify-content:space-between;padding-bottom:16px;
          border-bottom:1px solid var(--line-2)}
.brand{display:flex;flex-direction:column;gap:5px;min-width:0}
.brand .eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
                color:var(--accent);font-weight:600}
.brand h1{margin:0;font-size:1.5rem;font-weight:650;letter-spacing:-.01em;
          text-wrap:balance}
.brand .lede{color:var(--fg-2);font-size:.85rem;max-width:62ch}
.status{display:flex;flex-direction:column;gap:5px;align-items:flex-end;
        font-size:.78rem;color:var(--fg-2);white-space:nowrap}
.status .row{display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.dot.stale{background:var(--amber)} .dot.old{background:var(--red)}
.status b{font-family:var(--num);font-weight:500;color:var(--fg)}

/* 视图切换 */
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--bg-2);
      border:1px solid var(--line);border-radius:var(--r);padding:4px;width:fit-content;max-width:100%}
.tabs button{font:inherit;font-size:.86rem;cursor:pointer;border:0;
             background:transparent;color:var(--fg-2);padding:7px 15px;
             border-radius:7px;display:flex;align-items:baseline;gap:7px;
             transition:background .14s,color .14s}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-pressed="true"]{background:var(--panel);color:var(--fg);
             font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.tabs .n{font-family:var(--num);font-size:.74rem;color:var(--fg-3)}
.tabs button[aria-pressed="true"] .n{color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(166px,1fr));gap:11px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
     padding:14px 16px 13px;display:flex;flex-direction:column;gap:2px;min-width:0;
     position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;
             background:var(--accent);opacity:.75}
.kpi.b::before{background:var(--blue)} .kpi.a::before{background:var(--amber)}
.kpi .k{font-size:.73rem;color:var(--fg-2);letter-spacing:.02em}
.kpi .v{font-family:var(--num);font-size:1.72rem;line-height:1.2;
        font-weight:550;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:.75rem;color:var(--fg-3);display:flex;gap:7px;align-items:center;
          flex-wrap:wrap}
.chip{font-family:var(--num);font-size:.72rem;padding:1px 6px;border-radius:5px;
      background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.flat{background:var(--bg-2);color:var(--fg-3)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}

/* 卡片与网格 */
.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
@media (max-width:880px){.grid.c2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
      padding:16px 17px;display:flex;flex-direction:column;gap:13px;min-width:0}
.card>header{display:flex;justify-content:space-between;align-items:baseline;
             gap:12px;flex-wrap:wrap}
.card h2{margin:0;font-size:.95rem;font-weight:620;letter-spacing:-.005em}
.card .hint{font-size:.76rem;color:var(--fg-3)}
.seg{display:flex;gap:2px;background:var(--bg-2);border-radius:7px;padding:2px}
.seg button{font:inherit;font-size:.74rem;cursor:pointer;border:0;background:transparent;
            color:var(--fg-2);padding:3px 9px;border-radius:5px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);font-weight:600}
.chart{width:100%;min-width:0}
.note{margin:0;font-size:.79rem;color:var(--fg-3);line-height:1.6}

/* 语言构成 */
.langbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--bg-2)}
.langbar i{display:block;height:100%}
.langlist{display:flex;flex-direction:column;gap:7px;margin-top:3px}
.langrow{display:flex;align-items:center;gap:9px;font-size:.81rem}
.langrow .sw{width:9px;height:9px;border-radius:2px;flex:none}
.langrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.langrow .ct{font-family:var(--num);color:var(--fg-2);font-size:.78rem}

/* 表格 */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);
           background:var(--panel)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.82rem}
th,td{padding:9px 12px;text-align:right;white-space:nowrap;
      border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:1;
      background:var(--panel)}
thead th{font-size:.73rem;color:var(--fg-2);font-weight:600;cursor:pointer;
      user-select:none;background:var(--panel-2);position:sticky;top:0;z-index:2}
thead th:first-child{z-index:3}
thead th:hover{color:var(--fg)}
thead th[aria-sort]{color:var(--accent)}
tbody tr:hover td{background:var(--panel-2)}
tbody tr:hover td:first-child{background:var(--panel-2)}
tbody tr:last-child td{border-bottom:0}
td{font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--fg)}
td:first-child{font-family:var(--sans)}
td.zero{color:var(--amber);font-weight:600}
td.muted{color:var(--fg-3)}
.repo{display:flex;flex-direction:column;gap:1px;max-width:280px}
.repo .n{font-weight:560}
.repo .d{font-size:.73rem;color:var(--fg-3);overflow:hidden;
         text-overflow:ellipsis;white-space:nowrap}
.tag.br{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag{font-size:.69rem;padding:1px 6px;border-radius:4px;background:var(--bg-2);
     color:var(--fg-2);font-family:var(--sans)}

/* 提示块 */
.callout{border:1px solid var(--line);border-left:3px solid var(--amber);
         border-radius:var(--r);padding:13px 15px;background:var(--panel)}
.callout h3{margin:0 0 5px;font-size:.85rem;font-weight:620;color:var(--amber)}
.callout p{margin:0;font-size:.8rem;color:var(--fg-2);line-height:1.65}
.state{padding:56px 18px;text-align:center;color:var(--fg-2)}
.state code{font-family:var(--num);background:var(--bg-2);border:1px solid var(--line);
            border-radius:5px;padding:2px 7px;font-size:.84rem}
.foot{font-size:.76rem;color:var(--fg-3);display:flex;gap:16px;flex-wrap:wrap;
      padding-top:14px;border-top:1px solid var(--line)}
.foot a{color:var(--fg-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="state">正在读取数据 …</div>
</div>

<script>
(function () {
  "use strict";

  var SNAPSHOT = "snapshots/latest.json";
  var SERIES   = "timeseries.csv";
  var POLL_MS  = 5 * 60 * 1000;

  /* ── 分组配置：改这里即可调整看板的三个视图 ───────────────────────── */
  var GROUPS = [
    { id: "industry", name: "CANN 行业加速库",
      desc: "昇腾 CANN 社区面向电力、材料化学、油气、交通等垂直行业的算子库",
      match: function (r) {
        return r.org === "cann" &&
          /^(elec-ops-|mat-chem-|oil-gas-|its-)/.test(r.repo);
      } },
    { id: "solution", name: "openJiuwen 电力解决方案",
      desc: "agent-solution 仓库 electric 分支 —— 面向电力行业的解决方案与能力组件",
      match: function (r) {
        return r.org === "openJiuwen" && /^agent-solution@electric/.test(r.repo);
      } },
    { id: "all", name: "全部仓库",
      desc: "CANN 与 openJiuwen 两个组织下的全部公开仓库",
      match: function () { return true; } }
  ];

  var LANG_COLORS = ["#1f6b58","#2d6a92","#9a6f12","#a8443a","#6a4f8f",
                     "#2c8a71","#4b7f9e","#8a7a3c","#7a5248","#5c6b5e"];

  var S = null, SER = [], lastStamp = null, pollTimer = null;
  var group = GROUPS[0].id, trendKey = "stars";
  var sortKey = "stars", sortDir = -1;

  var N = function (v) {
    return (v === null || v === undefined || v === "") ? null : Number(v);
  };
  var f = function (v) {
    return (v === null || v === undefined || isNaN(v)) ? "—"
      : Number(v).toLocaleString("en-US");
  };
  var esc = function (s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  };

  /* ── 加载 ────────────────────────────────────────────────────────── */
  function load(first) {
    return fetch(SNAPSHOT, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (j) {
        if (!first && j.collected_at === lastStamp) return null;
        S = j;
        return fetch(SERIES, { cache: "no-store" })
          .then(function (r) { return r.ok ? r.text() : ""; })
          .catch(function () { return ""; })
          .then(function (t) { if (t) SER = parseCsv(t); render(); });
      });
  }

  function boot() {
    load(true).then(function () {
      pollTimer = setInterval(function () { if (!document.hidden) load(false); }, POLL_MS);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) load(false);
      });
    }).catch(function (e) {
      var isFile = location.protocol === "file:";
      document.getElementById("root").innerHTML =
        '<div class="state"><p><b>读不到数据</b>（' + esc(e.message) + '）</p>' +
        (isFile ? '<p>浏览器不允许 file:// 读取本地 JSON，请运行 <code>python serve.py</code></p>'
                : '<p>请确认 <code>' + SNAPSHOT + '</code> 存在，且采集器已运行过。</p>') +
        '</div>';
    });
  }

  function parseCsv(txt) {
    var lines = txt.replace(/^﻿/, "").trim().split(/\r?\n/);
    if (lines.length < 2) return [];
    var cols = lines[0].split(",").map(function (c) { return c.trim(); });
    return lines.slice(1).map(function (ln) {
      var c = ln.split(","), o = {};
      cols.forEach(function (k, i) { o[k] = (c[i] || "").trim(); });
      return o;
    });
  }

  /* ── 取数 ────────────────────────────────────────────────────────── */
  function cur() {
    for (var i = 0; i < GROUPS.length; i++) if (GROUPS[i].id === group) return GROUPS[i];
    return GROUPS[GROUPS.length - 1];
  }
  function rows(g) {
    return (S.repos || []).filter(g ? g.match : cur().match);
  }
  function sum(rs, k) {
    var any = false, t = 0;
    rs.forEach(function (r) { var v = N(r[k]); if (v !== null && !isNaN(v)) { t += v; any = true; } });
    return any ? t : null;
  }
  /** 时间序列按采集时刻汇总当前分组的某字段 */
  function trend(key) {
    if (!SER.length) return [];
    var g = cur(), m = {};
    SER.forEach(function (r) {
      if (!g.match({ org: r.org, repo: r.repo })) return;
      var v = Number(r[key]);
      if (!r.collected_at || isNaN(v)) return;
      m[r.collected_at] = (m[r.collected_at] || 0) + v;
    });
    return Object.keys(m).sort().map(function (t) { return { t: t, v: m[t] }; });
  }

  /* ── 绘图 ────────────────────────────────────────────────────────── */
  function lineChart(host, pts, label) {
    host.innerHTML = "";
    if (pts.length < 2) {
      var now = pts.length ? pts[pts.length - 1] : null;
      host.innerHTML =
        '<div style="display:flex;flex-direction:column;align-items:center;' +
        'justify-content:center;gap:9px;padding:34px 12px;text-align:center">' +
        (now ? '<div style="font-family:var(--num);font-size:2.1rem;font-weight:550;' +
               'letter-spacing:-.02em">' + f(now.v) + '</div>' +
               '<div style="font-size:.78rem;color:var(--fg-3)">当前值 · ' +
               esc(now.t.slice(5, 16).replace("T", " ")) + '</div>' : '') +
        '<div style="height:1px;width:56px;background:var(--line-2);margin:4px 0"></div>' +
        '<p class="note" style="max-width:34ch">趋势图需要至少两次采集。' +
        '已累积 <b style="font-family:var(--num)">' + pts.length + '</b> 个数据点，' +
        '采集器每 6 小时运行一次，曲线会逐步生成。</p></div>';
      return;
    }
    var w = Math.max(320, host.clientWidth || 700), h = 190;
    var pl = 62, pr = 16, pt = 14, pb = 28;
    var vs = pts.map(function (p) { return p.v; });
    var mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs);
    if (mn === mx) { mn -= 1; mx += 1; }
    var pad = (mx - mn) * 0.12; mn -= pad; mx += pad;
    var X = function (i) { return pl + i / (pts.length - 1) * (w - pl - pr); };
    var Y = function (v) { return pt + (1 - (v - mn) / (mx - mn)) * (h - pt - pb); };
    var o = ['<svg width="100%" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' +
             esc(label) + '趋势"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">' +
             '<stop offset="0%" stop-color="var(--accent)" stop-opacity=".22"/>' +
             '<stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>' +
             '</linearGradient></defs>'];
    for (var i = 0; i <= 3; i++) {
      var gv = mn + (mx - mn) * i / 3, gy = Y(gv);
      o.push('<line x1="' + pl + '" x2="' + (w - pr) + '" y1="' + gy + '" y2="' + gy +
        '" stroke="var(--line)" stroke-width="1"/>');
      o.push('<text x="' + (pl - 8) + '" y="' + gy + '" dy="0.34em" text-anchor="end" ' +
        'font-size="10" font-family="var(--num)" fill="var(--fg-3)">' +
        f(Math.round(gv)) + '</text>');
    }
    var d = pts.map(function (p, i) { return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.v).toFixed(1); }).join(" ");
    o.push('<path d="' + d + ' L' + X(pts.length - 1).toFixed(1) + ' ' + (h - pb) +
      ' L' + pl + ' ' + (h - pb) + ' Z" fill="url(#g1)"/>');
    o.push('<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2" ' +
      'stroke-linejoin="round" stroke-linecap="round"/>');
    pts.forEach(function (p, i) {
      if (pts.length <= 20 || i === pts.length - 1) {
        o.push('<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="' +
          (i === pts.length - 1 ? 4 : 2.5) + '" fill="var(--accent)"><title>' +
          esc(p.t.slice(0, 16).replace("T", " ")) + "：" + f(p.v) + '</title></circle>');
      }
    });
    [0, pts.length - 1].forEach(function (i) {
      o.push('<text x="' + X(i).toFixed(1) + '" y="' + (h - 8) + '" font-size="10" ' +
        'font-family="var(--num)" fill="var(--fg-3)" text-anchor="' +
        (i ? "end" : "start") + '">' + esc(pts[i].t.slice(5, 16).replace("T", " ")) + '</text>');
    });
    o.push("</svg>");
    host.innerHTML = o.join("");
  }

  function barChart(host, items, opt) {
    opt = opt || {};
    host.innerHTML = "";
    if (!items.length) { host.innerHTML = '<p class="note">本视图暂无可排名的仓库。</p>'; return; }
    var w = Math.max(300, host.clientWidth || 640);
    var narrow = w < 520, pl = narrow ? 120 : 196, pr = 62, rh = 23, pt = 3;
    var h = pt * 2 + items.length * rh;
    var mx = Math.max.apply(null, items.map(function (d) { return d.v || 0; })) || 1;
    var iw = Math.max(26, w - pl - pr);
    var o = ['<svg width="100%" viewBox="0 0 ' + w + ' ' + h + '" role="img">'];
    items.forEach(function (d, i) {
      var y = pt + i * rh, bw = Math.max(2, (d.v || 0) / mx * iw);
      var lb = narrow && d.label.length > 17 ? d.label.slice(0, 16) + "…" : d.label;
      o.push('<text x="' + (pl - 9) + '" y="' + (y + rh / 2) + '" dy="0.34em" ' +
        'text-anchor="end" font-size="11.5" fill="var(--fg-2)">' + esc(lb) + '</text>');
      o.push('<rect x="' + pl + '" y="' + (y + 4.5) + '" width="' + bw.toFixed(1) +
        '" height="' + (rh - 9) + '" rx="2.5" fill="' + (d.color || "var(--accent)") +
        '"><title>' + esc(d.label) + "：" + f(d.v) + '</title></rect>');
      o.push('<text x="' + (pl + bw + 7).toFixed(1) + '" y="' + (y + rh / 2) +
        '" dy="0.34em" font-size="11" font-family="var(--num)" fill="var(--fg)">' +
        f(d.v) + (opt.suffix || "") + '</text>');
    });
    o.push("</svg>");
    host.innerHTML = o.join("");
  }

  /* ── 渲染 ────────────────────────────────────────────────────────── */
  var COLS = [
    ["name", "仓库", "t"], ["stars", "Star", "n"], ["forks", "Fork", "n"],
    ["issues_total", "Issue", "n"], ["issues_open", "未关闭", "n"],
    ["pr_all", "PR", "n"], ["pr_merged", "已合入", "n"],
    ["pr_created_window", "新增 PR", "n"],
    ["commits_total", "提交", "n"], ["commits_window", "窗内提交", "n"],
    ["downloads_all", "下载", "n"], ["visits_30d", "访问", "n"],
    ["language", "语言", "t"], ["pushed_at", "最后提交", "t"]
  ];

  function render() {
    lastStamp = S.collected_at;
    var g = cur(), rs = rows(), win = S.window_days || 30;
    var mdate = S.manual_metrics_measured_at;
    var ageH = S.collected_at
      ? Math.round((Date.now() - new Date(S.collected_at)) / 3600000) : null;
    var dotCls = ageH === null ? "" : (ageH > 36 ? "old" : (ageH > 12 ? "stale" : ""));
    var h = [];

    /* 头部 */
    h.push('<div class="masthead"><div class="brand">' +
      '<span class="eyebrow">昇腾开源社区 · 指标看板</span>' +
      '<h1>CANN 与 openJiuwen 社区指标</h1>' +
      '<span class="lede">' + esc(g.desc) + '</span></div>' +
      '<div class="status">' +
      '<span class="row"><span class="dot ' + dotCls + '"></span>数据更新于 <b>' +
      esc((S.collected_at || "").replace("T", " ").slice(0, 16)) + '</b></span>' +
      '<span class="row">覆盖 <b>' + f((S.repos || []).length) + '</b> 个仓库 · 时间窗近 <b>' +
      win + '</b> 天</span>' +
      '<span class="row">每 6 小时自动采集 · 本页 5 分钟自检</span>' +
      '</div></div>');

    /* 视图切换 */
    h.push('<div class="tabs" id="tabs">');
    GROUPS.forEach(function (x) {
      h.push('<button data-g="' + x.id + '" aria-pressed="' + (x.id === group) + '">' +
        esc(x.name) + '<span class="n">' + rows(x).length + '</span></button>');
    });
    h.push('</div>');

    if (!rs.length) {
      h.push('<div class="card"><p class="note">该分组下没有匹配到仓库。' +
        '分组规则在页面源码顶部的 GROUPS 配置中，可按需调整。</p></div>');
      document.getElementById("root").innerHTML = h.join("");
      bindTabs();
      return;
    }

    /* KPI */
    var tr = trend("stars");
    var dStar = tr.length >= 2 ? tr[tr.length - 1].v - tr[tr.length - 2].v : null;
    var stale = rs.filter(function (r) { return N(r.commits_window) === 0; }).length;
    var dl = sum(rs, "downloads_all");
    var kpi = [
      ["Star 合计", sum(rs, "stars"),
       dStar === null ? "" : "<span class='chip" + (dStar > 0 ? "" : " flat") + "'>" +
       (dStar > 0 ? "+" : "") + f(dStar) + " 较上次</span>", ""],
      ["Fork 合计", sum(rs, "forks"), "", ""],
      ["Issue 累计", sum(rs, "issues_total"),
       "未关闭 " + f(sum(rs, "issues_open")), "b"],
      ["PR 累计", sum(rs, "pr_all"),
       "已合入 " + f(sum(rs, "pr_merged")), "b"],
      ["近 " + win + " 天提交", sum(rs, "commits_window"),
       stale ? "<span class='chip warn'>" + stale + " 个仓库零提交</span>" : "全部有更新", ""],
      ["下载量累计", dl,
       dl ? "人工录入" : "<span class='chip warn'>待录入</span>", "a"]
    ];
    h.push('<div class="kpis">');
    kpi.forEach(function (k) {
      h.push('<div class="kpi ' + (k[3] || "") + '"><span class="k">' + k[0] +
        '</span><span class="v">' + f(k[1]) + '</span>' +
        (k[2] ? '<span class="sub">' + k[2] + '</span>' : '') + '</div>');
    });
    h.push('</div>');

    /* 趋势 + 语言构成 */
    h.push('<div class="grid c2">');
    h.push('<div class="card"><header><h2>指标趋势</h2>' +
      '<div class="seg" id="seg">' +
      [["stars", "Star"], ["pr_all", "PR"], ["issues_total", "Issue"],
       ["commits_total", "提交"]].map(function (x) {
        return '<button data-k="' + x[0] + '" aria-pressed="' +
          (x[0] === trendKey) + '">' + x[1] + '</button>';
      }).join("") + '</div></header>' +
      '<div class="chart" id="trend"></div>' +
      '<p class="note">历史由每次采集累积，平台不提供回溯数据。</p></div>');

    var langs = {};
    rs.forEach(function (r) {
      var L = r.language || "其他";
      langs[L] = (langs[L] || 0) + 1;
    });
    var ls = Object.keys(langs).map(function (k) { return { k: k, v: langs[k] }; })
      .sort(function (a, b) { return b.v - a.v; });
    var top = ls.slice(0, 7), rest = ls.slice(7);
    if (rest.length) top.push({ k: "其他 " + rest.length + " 种",
      v: rest.reduce(function (s, x) { return s + x.v; }, 0) });
    h.push('<div class="card"><header><h2>语言构成</h2>' +
      '<span class="hint">' + rs.length + ' 个仓库</span></header>' +
      '<div class="langbar">' + top.map(function (x, i) {
        return '<i style="width:' + (x.v / rs.length * 100).toFixed(2) + '%;background:' +
          LANG_COLORS[i % LANG_COLORS.length] + '" title="' + esc(x.k) + '"></i>';
      }).join("") + '</div><div class="langlist">' +
      top.map(function (x, i) {
        return '<div class="langrow"><span class="sw" style="background:' +
          LANG_COLORS[i % LANG_COLORS.length] + '"></span>' +
          '<span class="nm">' + esc(x.k) + '</span>' +
          '<span class="ct">' + x.v + ' · ' +
          (x.v / rs.length * 100).toFixed(0) + '%</span></div>';
      }).join("") + '</div></div>');
    h.push('</div>');

    /* 排名 + 活跃度 */
    if (rs.length > 1) {
      h.push('<div class="grid c2">');
      h.push('<div class="card"><header><h2>Star 排名</h2>' +
        '<span class="hint">前 ' + Math.min(12, rs.length) + ' 名</span></header>' +
        '<div class="chart" id="rank"></div></div>');
      h.push('<div class="card"><header><h2>近 ' + win + ' 天提交活跃度</h2>' +
        '<span class="hint">零提交标橙</span></header>' +
        '<div class="chart" id="act"></div></div>');
      h.push('</div>');
    }

    /* 明细表 */
    h.push('<div class="card" style="padding:0;background:transparent;border:0;gap:9px">' +
      '<header style="padding:0 2px"><h2>仓库明细</h2>' +
      '<span class="hint">点表头排序 · 带下载与访问两列为人工录入</span></header>' +
      '<div class="tablewrap"><table><thead><tr>');
    COLS.forEach(function (c) {
      h.push('<th data-k="' + c[0] + '"' +
        (sortKey === c[0] ? ' aria-sort="' + (sortDir < 0 ? "descending" : "ascending") + '"' : '') +
        '>' + c[1] + (sortKey === c[0] ? (sortDir < 0 ? " ↓" : " ↑") : "") + '</th>');
    });
    h.push('</tr></thead><tbody>');
    rs.slice().sort(function (a, b) {
      var ka = sortKey === "name" ? (a.org + "/" + a.repo) : a[sortKey];
      var kb = sortKey === "name" ? (b.org + "/" + b.repo) : b[sortKey];
      if (sortKey === "name" || sortKey === "language" || sortKey === "pushed_at") {
        return String(ka || "").localeCompare(String(kb || "")) * sortDir;
      }
      return ((N(ka) || 0) - (N(kb) || 0)) * sortDir;
    }).forEach(function (r) {
      h.push("<tr>");
      COLS.forEach(function (c) {
        var k = c[0], v, cls = "";
        if (k === "name") {
          v = '<div class="repo"><span class="n">' + esc(r.repo) +
              (r.is_branch ? ' <span class="tag br">分支</span>' : '') + '</span>' +
              '<span class="d">' + esc(r.org) +
              (r.description ? " · " + esc(r.description.slice(0, 46)) : "") + '</span></div>';
        } else if (k === "language") {
          v = r.language ? '<span class="tag">' + esc(r.language) + '</span>' : '<span class="tag">—</span>';
        } else if (k === "pushed_at") {
          v = esc(String(r[k] || "").slice(0, 10)); cls = " class=\"muted\"";
        } else {
          var n = N(r[k]);
          v = f(n);
          if (k === "commits_window" && n === 0) cls = ' class="zero"';
          else if ((k === "downloads_all" || k === "visits_30d") && !n) cls = ' class="muted"';
          // 分支行的仓库级指标是继承来的，置灰以示区别
          else if (r.is_branch &&
                   ["stars","forks","issues_total","issues_open"].indexOf(k) >= 0) {
            cls = ' class="muted" title="仓库级指标，分支无独立计数"';
          }
        }
        h.push("<td" + cls + ">" + v + "</td>");
      });
      h.push("</tr>");
    });
    h.push('</tbody></table></div></div>');

    /* 分支视图说明 */
    if (rs.some(function (r) { return r.is_branch; })) {
      h.push('<div class="callout" style="border-left-color:var(--blue)">' +
        '<h3 style="color:var(--blue)">分支级统计的口径</h3><p>' +
        'Star、Fork、Issue 只存在于仓库级别，分支没有独立计数 —— 这是 git 托管平台的' +
        '数据模型决定的，表中这几列为所属仓库的值（已置灰）。' +
        '真正按分支统计的是<b>提交数</b>（该分支的提交）与 <b>PR 数</b>' +
        '（以该分支为合入目标的 PR）。</p></div>');
    }

    /* 数据说明 */
    h.push('<div class="callout"><h3>下载量与访问量为人工录入</h3><p>' +
      'GitCode 未开放流量类接口（实测 10 个候选路径全部 404，官方 21 个 API 分类中亦无此类目），' +
      '这两项需从网页抄录后填入 manual_metrics.csv。' +
      (mdate ? '当前实测日 <b>' + esc(mdate) + '</b>，与自动采集时点可能不一致。'
             : '当前尚未录入。') + '</p></div>');

    h.push('<div class="foot"><span>数据源：GitCode OpenAPI</span>' +
      '<span>采集耗时 ' + (S.elapsed_sec || "—") + ' 秒</span>' +
      '<span>快照 schema v' + (S.schema || 1) + '</span></div>');

    document.getElementById("root").innerHTML = h.join("");

    lineChart(document.getElementById("trend"), trend(trendKey), trendKey);
    if (rs.length > 1) {
      barChart(document.getElementById("rank"),
        rs.slice().sort(function (a, b) { return (N(b.stars) || 0) - (N(a.stars) || 0); })
          .slice(0, 12).map(function (r) {
            return { label: r.repo, v: N(r.stars) };
          }));
      barChart(document.getElementById("act"),
        rs.slice().sort(function (a, b) { return (N(b.commits_window) || 0) - (N(a.commits_window) || 0); })
          .slice(0, 12).map(function (r) {
            var n = N(r.commits_window) || 0;
            return { label: r.repo, v: n, color: n ? "var(--blue)" : "var(--amber)" };
          }), { suffix: " 次" });
    }
    bindTabs();
  }

  function bindTabs() {
    var t = document.getElementById("tabs");
    if (t) t.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-g]");
      if (b) { group = b.getAttribute("data-g"); render(); }
    });
    var s = document.getElementById("seg");
    if (s) s.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-k]");
      if (b) { trendKey = b.getAttribute("data-k"); render(); }
    });
    document.querySelectorAll("thead th[data-k]").forEach(function (th) {
      th.addEventListener("click", function () {
        var k = th.getAttribute("data-k");
        if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = -1; }
        render();
      });
    });
  }

  var rt;
  window.addEventListener("resize", function () {
    clearTimeout(rt); rt = setTimeout(function () { if (S) render(); }, 180);
  });

  boot();
})();
</script>
</body>
</html>
